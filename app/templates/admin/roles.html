{% extends "base.html" %}
{% block page_title %}{{ t('menu.roles', lang) }}{% endblock %}
{% block content %}
{% for role in roles %}
<div class="card">
  <div class="card-header">
    <h2>{{ role.name }} <span class="muted small">({{ role.key }})</span></h2>
  </div>
  <form method="post" action="/admin/roles/{{ role.id }}/permissions">
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
      {% for key, desc in permissions.items() %}
      <label style="font-weight:400;font-size:13px;display:flex;gap:8px;align-items:center">
        <input type="checkbox" name="perm_{{ key }}" {% if key in role.permissions %}checked{% endif %} style="width:auto"> {{ key }}
      </label>
      {% endfor %}
    </div>
    <div class="form-actions"><button type="submit" class="btn primary">{{ t('common.save', lang) }}</button></div>
  </form>
</div>
{% endfor %}
{% endblock %}

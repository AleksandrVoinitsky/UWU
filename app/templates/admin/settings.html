{% extends "base.html" %}
{% block page_title %}{{ t('menu.settings', lang) }}{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header"><h2>Константы</h2></div>
  <form method="post" action="/admin/settings">
    <div class="form-row">
      <div class="field">
        <label>Контроль остатков</label>
        <select name="const_restock_control">
          <option value="by_warehouse" {% if constants.restock_control == 'by_warehouse' %}selected{% endif %}>По складу</option>
          <option value="by_firm" {% if constants.restock_control == 'by_firm' %}selected{% endif %}>По фирме</option>
          <option value="none" {% if constants.restock_control == 'none' %}selected{% endif %}>Без контроля</option>
        </select>
      </div>
      <div class="field">
        <label>Метод списания себестоимости</label>
        <select name="const_cost_method">
          <option value="fifo" {% if constants.cost_method == 'fifo' %}selected{% endif %}>FIFO</option>
          <option value="lifo" {% if constants.cost_method == 'lifo' %}selected{% endif %}>LIFO</option>
          <option value="average" {% if constants.cost_method == 'average' %}selected{% endif %}>Средняя</option>
        </select>
      </div>
      <div class="field">
        <label>Префикс ИБ</label>
        <input type="text" name="const_prefix_ib" value="{{ constants.prefix_ib or '' }}">
      </div>
      <div class="field">
        <label>Валюта бухгалтерского учёта</label>
        <select name="const_currency_buh_id">
          <option value="">—</option>
          {% for v in valyuty %}<option value="{{ v.id }}" {% if constants.currency_buh_id == v.id %}selected{% endif %}>{{ v.code }}</option>{% endfor %}
        </select>
      </div>
      <div class="field">
        <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="const_allow_future_dates" {% if constants.allow_future_dates %}checked{% endif %} style="width:auto"> Разрешить будущие даты</label>
      </div>
      <div class="field">
        <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="const_enforce_min_price" {% if constants.enforce_min_price %}checked{% endif %} style="width:auto"> Контроль минимальной цены (не ниже закупочной)</label>
      </div>
    </div>
    <hr class="divider">
    <h2>Печатная форма накладной</h2>
    <div class="form-row">
      <div class="field"><label>Название организации</label><input type="text" name="const_invoice_company_name" value="{{ constants.invoice_company_name or '' }}"></div>
      <div class="field"><label>ИНН</label><input type="text" name="const_invoice_company_inn" value="{{ constants.invoice_company_inn or '' }}"></div>
      <div class="field"><label>Адрес</label><input type="text" name="const_invoice_company_address" value="{{ constants.invoice_company_address or '' }}"></div>
      <div class="field"><label>Текст в подвале</label><input type="text" name="const_invoice_footer" value="{{ constants.invoice_footer or '' }}"></div>
    </div>
    <div class="form-actions"><button type="submit" class="btn primary">{{ t('common.save', lang) }}</button></div>
  </form>
</div>
{% endblock %}

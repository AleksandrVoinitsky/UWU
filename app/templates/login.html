<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('auth.login', lang) }} — {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>{{ app_name }}</h1>
      <p class="subtitle">{{ t('auth.login', lang) }}</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <div class="field">
          <label>{{ t('auth.username', lang) }}</label>
          <input type="text" name="login" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label>{{ t('auth.password', lang) }}</label>
          <input type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn" style="width:100%">{{ t('auth.signin', lang) }}</button>
      </form>
    </div>
  </div>
</body>
</html>

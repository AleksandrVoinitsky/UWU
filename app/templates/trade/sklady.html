{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>{{ t('catalog.sklady', lang) }}</h1>
</div>

<div class="card">
  <h2>{{ t('common.add', lang) }}</h2>
  <form method="post" action="/catalog/sklady" class="flex" style="align-items:flex-end">
    <div class="field"><label>{{ t('common.code', lang) }}</label><input type="text" name="code" required></div>
    <div class="field" style="flex:1"><label>{{ t('common.name', lang) }}</label><input type="text" name="name" required></div>
    <div class="field"><label>Тип</label><select name="tip"><option value="optovy">Оптовый</option><option value="roznichny">Розничный</option><option value="neavtomat">НТТ</option></select></div>
    <button type="submit" class="btn">{{ t('common.add', lang) }}</button>
  </form>
</div>

<div class="card">
  <table class="table">
    <thead><tr><th>{{ t('common.code', lang) }}</th><th>{{ t('common.name', lang) }}</th><th>Тип</th></tr></thead>
    <tbody>
      {% for item in items %}
      <tr><td>{{ item.code }}</td><td>{{ item.name }}</td><td>{{ item.tip }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}

{% extends "base.html" %}
{% block page_title %}Категории товаров{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header"><h2>Категории товаров <span class="muted">· {{ items|length }}</span></h2></div>
  <div class="table-wrap">
    <table class="table" data-table>
      <thead><tr><th>Наименование</th><th class="num">Порядок</th><th></th></tr></thead>
      <tbody>
        {% for c in items %}
        <tr>
          <td>{{ c.name }}</td>
          <td class="num">{{ c.sort }}</td>
          <td class="num">
            <form method="post" action="/catalog/categories/{{ c.id }}/delete" onsubmit="return confirm('Удалить категорию?')">
              <button class="btn text small danger" type="submit">Удалить</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<div class="card">
  <div class="card-header"><h2>Добавить категорию</h2></div>
  <form method="post" action="/catalog/categories">
    <div class="form-row">
      <div class="field"><label>Наименование</label><input type="text" name="name" required></div>
      <div class="field"><label>Порядок</label><input type="number" name="sort" value="0"></div>
    </div>
    <div class="form-actions"><button type="submit" class="btn primary">{{ t('common.save', lang) }}</button></div>
  </form>
</div>
{% endblock %}

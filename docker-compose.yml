services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: uwu
      POSTGRES_PASSWORD: uwu
      POSTGRES_DB: uwu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uwu -d uwu"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Тестовая БД для автотестов (pytest). Изолирована от рабочей ``uwu``, потому
  # что тесты делают TRUNCATE/drop_all по всем таблицам — если бы они указывали
  # на боевую БД, то затирали бы реальные данные. Управляется тем же compose:
  # `docker compose up -d db_test`. Хост-порт 5433 использует conftest.py.
  db_test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: uwu
      POSTGRES_PASSWORD: uwu
      POSTGRES_DB: uwu_test
    ports:
      - "5433:5432"
    volumes:
      - pgtestdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uwu -d uwu_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://uwu:uwu@db:5432/uwu?ssl=disable
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@uwu.local}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-RUB}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-ru}
      UPLOADS_DIR: /app/uploads
      MINIAPP_DEV: ${MINIAPP_DEV:-false}
      # Семантический поиск (pgvector + OpenAI-совместимые эмбеддинги).
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # AI-агент (отдельный сервис uwu-ai-agent): webhook для уведомления о
      # новых входящих сообщениях (пусто — уведомление выключено).
      AGENT_WEBHOOK_URL: ${AGENT_WEBHOOK_URL:-http://agent:8100/webhook}
      # API-ключ агента: ядро при старте гарантирует существование ключа с этим
      # значением; тот же ключ передаётся сервису uwu-ai-agent.
      AGENT_API_KEY: ${AGENT_API_KEY:-uwu-dev-agent-key-change-me}
      # development — работает «из коробки» (слабые секреты допустимы с
      # предупреждением). production — небезопасные SECRET_KEY/пароль блокируют
      # запуск (fail-fast); задайте ENVIRONMENT=production и надёжные секреты.
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  # AI-агент — отдельный контейнер (клиент REST API ядра, не пишет в БД напрямую).
  agent:
    build: ./uwu-ai-agent
    depends_on:
      app:
        condition: service_started
    environment:
      CORE_BASE_URL: http://app:8000
      AGENT_API_KEY: ${AGENT_API_KEY:-uwu-dev-agent-key-change-me}
      # LLM (OpenAI-совместимый API). Пустой LLM_API_KEY — fallback-режим.
      LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      LLM_MODEL: ${AGENT_LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${AGENT_LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${AGENT_LLM_MAX_TOKENS:-512}
      POLL_INTERVAL: ${AGENT_POLL_INTERVAL:-2.0}
      ENABLE_POLLING: ${AGENT_ENABLE_POLLING:-true}
    ports:
      - "8100:8100"
    restart: unless-stopped

volumes:
  pgdata:
  pgtestdata:
  uploads:

[project]
name = "uwu"
version = "0.1.0"
description = "UWU — многопользовательский сервис торгового и складского учёта (аналог 1С 7.7 Торговля и Склад)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "PyJWT==2.10.1",
    "bcrypt==4.2.1",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "markdown==3.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
